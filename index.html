<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest">

<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#0f172a;--mu:#64748b;--bd:#e2e8f0;--in:#eef2f7;--ac:#0ea5e9;--acs:rgba(14,165,233,.18);--gd:#0ea5e9;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0a0e17;--card:#111827;--tx:#f1f5f9;--mu:#8b97ab;--bd:#1f2937;--in:#1a2232;--ac:#0ea5e9;--acs:rgba(14,165,233,.18);--gd:#0ea5e9;--on:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--bd);max-width:520px;margin:auto}
header b{font-size:22px}#sc{font-size:13px;color:var(--mu)}#sc.w{color:#fb923c}#sc.x{color:#ef4444}
main{max-width:520px;margin:auto;padding:16px 16px 120px}
h1{font-size:28px;margin:8px 0 2px}h3{margin:0 0 12px;font-size:20px}
.sub{color:var(--mu);margin:0 0 16px;font-size:15px}small{display:block;color:var(--mu);font-size:12px}
.btn{width:100%;border:0;border-radius:999px;background:var(--ac);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:13px;cursor:pointer;box-shadow:0 6px 24px rgba(14,165,233,.3);margin-top:8px}
.btn.ghost{background:var(--in);color:var(--tx);box-shadow:none}.btn.danger{background:#ef4444;box-shadow:none}
.card{background:var(--card);border:1px solid var(--bd);border-radius:26px;padding:16px}
.seg{display:flex;background:var(--in);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:9px 4px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:rgba(14,165,233,.2);color:var(--ac);font-weight:700}
.row{display:grid;grid-template-columns:1fr repeat(4,46px);align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.dh{border-top:0;font-size:12px;color:var(--mu);text-align:center;margin-top:8px}.dh .sum{text-align:start}.dh .td{color:var(--ac)}.dh b{font-size:15px}
.nm{display:flex;align-items:center;gap:10px;cursor:pointer}.nm b{color:var(--c)}
.cell{border:0;background:none;height:40px;font:inherit;font-size:14px;color:var(--mu);cursor:pointer;opacity:.6}.cell.ok{color:var(--c);opacity:1;font-weight:700;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:12px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}.chip.on{border-color:var(--ac);color:var(--ac);background:rgba(14,165,233,.12)}
.lb{color:var(--mu);font-size:14px;margin:12px 0 0}
.ringw{position:relative;width:min(260px,70vw);margin:12px auto}.ringw svg{display:block;width:100%}
.rb{fill:none;stroke:var(--in);stroke-width:10}.rf{fill:none;stroke:var(--ac);stroke-width:10;stroke-linecap:round;transition:stroke-dasharray .4s linear}
.tm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;direction:ltr}
#tt{font-size:44px;font-weight:700;background:var(--bg);padding:2px 18px;border-radius:14px;font-variant-numeric:tabular-nums}
.ctl{display:flex;gap:10px}.big{font-size:42px;font-weight:700;margin:6px 0}
.bar{height:10px;border-radius:9px;background:var(--in);overflow:hidden}.bar i{display:block;height:100%;border-radius:9px}
.ln{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd)}
.set{display:flex;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--bd)}.set:first-of-type{border-top:0}.set div{flex:1}.set b{font-size:15px}
.ic{width:42px;height:42px;border-radius:12px;background:var(--in);display:grid;place-items:center;font-size:20px;flex:none}
.sw2{position:relative;width:46px;height:26px;flex:none}.sw2 input{opacity:0;position:absolute;inset:0;margin:0;z-index:1;cursor:pointer}
.sw2 i{position:absolute;inset:0;background:var(--in);border:1px solid var(--bd);border-radius:20px;transition:.2s}
.sw2 i:before{content:"";position:absolute;top:2px;inset-inline-start:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw2 input:checked+i{background:var(--ac)}.sw2 input:checked+i:before{inset-inline-start:22px}
input[type=range]{width:100%;accent-color:var(--ac)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav .in{display:flex;width:100%;max-width:520px}
nav button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:13px;padding:10px 0 12px;cursor:pointer}nav button span{display:block;font-size:22px}
nav button.on{color:var(--ac);font-weight:700}nav.lk button:not(.on){opacity:.35}
#sh{position:fixed;inset:0;display:none;z-index:50}#sh.on{display:block}.bk{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.pn{position:absolute;bottom:0;left:0;right:0;max-width:520px;margin:auto;background:var(--card);border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.pn label{display:block;margin:14px 0 6px;font-size:14px;color:var(--mu)}
.pn input[type=text],.pn input[type=number]{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit;font-size:16px}
.opt{display:block;width:100%;text-align:start;border:1px solid var(--bd);background:var(--in);color:var(--tx);border-radius:16px;padding:12px 14px;font:inherit;margin-bottom:8px;cursor:pointer}.opt.on{border-color:var(--ac);background:rgba(14,165,233,.12)}
.cols{display:flex;gap:10px;flex-wrap:wrap}.sw{width:42px;height:42px;border-radius:50%;border:3px solid transparent;cursor:pointer}.sw.on{border-color:var(--tx)}
#eye{position:fixed;inset:0;background:rgba(40,20,0,.3);pointer-events:none;z-index:99;display:none}
#ts{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none;z-index:60;font-size:14px;max-width:90vw;text-align:center}#ts.on{opacity:1}
.btn{color:var(--on);box-shadow:0 6px 24px var(--acs)}.btn.danger{color:#fff}.seg button.on,.chip.on,.opt.on{background:var(--acs)}
</style>
</head>
<body>
<header><b>Mizan 360</b><span id="sc"></span></header>
<main id="v"></main>
<nav id="nv"><div class="in">
<button data-a="tab" data-v="d"><span>🧭</span>اليوم</button>
<button data-a="tab" data-v="h"><span>✅</span>العادات</button>
<button data-a="tab" data-v="t"><span>⏱</span>الوقت</button>
<button data-a="tab" data-v="s"><span>⚙️</span>الإعدادات</button>
</div></nav>
<div id="sh"></div><div id="eye"></div><div id="ts"></div>
<script>
var $=function(s){return document.querySelector(s)};
var K="mizan_v1",COL=["#a78bfa","#38bdf8","#34d399","#a3e635","#f472b6","#fb923c"];
var DN=["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
var CATS=["قراءة","مذاكرة","قطع التليفون","مراجعة","عمل عميق"];
var S={lang:"ar",dark:true,limit:2,lock:true,eye:false,sound:true,habits:[],log:{},screen:{},sess:{},tasks:[],hrs:{},tab:"d",filter:"all"};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){}
if(!S.init){S.init=1;S.habits=[
{id:"a1",name:"أذكار الصباح",type:"yn",goal:0,color:"#fb923c"},
{id:"a2",name:"غسيل الأسنان",type:"yn",goal:0,color:"#f472b6"},
{id:"a3",name:"مراجعة قرآن",type:"min",goal:20,color:"#38bdf8"},
{id:"a4",name:"النوم مبكراً",type:"yn",goal:0,color:"#34d399"}]}
S.habits.forEach(function(h){if(!h.area)h.area=/قرآن|أذكار|صلاة/.test(h.name)?"روحاني":/مذاكر|دراس|قراءة|مراجعة/.test(h.name)?"دراسة":"صحة"});
var T={mode:"d",ph:"f",cyc:1,dmin:5,cat:"قطع التليفون",run:false,left:300,total:300,end:0},tmp={},sv=0,warned="";
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
var pad=function(n){return String(n).padStart(2,"0")};
var dk=function(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
var td=function(){return dk(new Date())};
var H=function(id){return S.habits.find(function(h){return h.id==id})};
var val=function(h,d){return (S.log[h.id]||{})[d]||0};
var prog=function(h,d){var v=val(h,d);return h.type=="yn"?(v?1:0):(h.goal>0?Math.min(v/h.goal,1):(v>0?1:0))};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var fmt=function(s){return pad(Math.floor(s/60))+":"+pad(s%60)};
var hm=function(s){return Math.floor(s/3600)+" س "+Math.floor(s%3600/60)+" د"};
function toast(t){var e=$("#ts");e.textContent=t;tr(e);e.className="on";clearTimeout(toast.t);toast.t=setTimeout(function(){e.className=""},2200)}
function sheet(h){$("#sh").innerHTML='<div class="bk" data-a="close"></div><div class="pn">'+h+'</div>';$("#sh").className="on";tr($("#sh"))}
function cl(){$("#sh").className=""}
function ring(p,c){return '<svg width="30" height="30" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--in)" stroke-width="4"/><circle cx="18" cy="18" r="15" fill="none" stroke="'+c+'" stroke-width="4" stroke-linecap="round" stroke-dasharray="'+(p*94.2)+' 94.2" transform="rotate(-90 18 18)"/></svg>'}
function lock(){return T.run&&T.mode=="d"&&S.lock}
function ap(){document.documentElement.dataset.theme=S.dark?"dark":"light";document.documentElement.lang=S.lang;document.documentElement.dir=S.lang=="en"?"ltr":"rtl";$("#eye").style.display=S.eye?"block":"none"}
function hdr(){var s=S.screen[td()]||0,lim=S.limit*3600,e=$("#sc");e.textContent=Math.floor(s/60)+" د / "+S.limit+" س";tr(e);e.className=s>=lim?"x":s>=lim*.85?"w":"";if(s>=lim&&warned!=td()){warned=td();toast("وصلت للحد اليومي للشاشة")}}

var AR=["روحاني","دراسة","صحة"];
function streak(h){var n=0,d=new Date();if(prog(h,dk(d))<1)d.setDate(d.getDate()-1);while(n<400&&prog(h,dk(d))>=1){n++;d.setDate(d.getDate()-1)}return n}
function axes(){var k=td(),o=[];AR.forEach(function(a){var L=S.habits.filter(function(h){return h.area==a});o.push([a,L.length?L.reduce(function(s,h){return s+prog(h,k)},0)/L.length:null])});var ss=S.sess[k]||{},m=0;for(var c in ss)m+=ss[c];o.push(["تركيز",Math.min(m/120,1)]);o.push(["توازن رقمي",1-Math.min((S.screen[k]||0)/(S.limit*3600),1)]);return o}
function vD(){var A=axes(),v=A.filter(function(x){return x[1]!==null}),sc=Math.round(v.reduce(function(s,x){return s+x[1]},0)/v.length*100),cx=130,cy=118,R=80,n=A.length,pts=[],grid="",lab="";
A.forEach(function(x,i){var a=-Math.PI/2+i*2*Math.PI/n,r=R*(x[1]||0);pts.push((cx+r*Math.cos(a)).toFixed(1)+","+(cy+r*Math.sin(a)).toFixed(1));lab+='<text x="'+(cx+(R+22)*Math.cos(a)).toFixed(1)+'" y="'+(cy+(R+22)*Math.sin(a)+4).toFixed(1)+'" text-anchor="middle" font-size="11" fill="var(--mu)">'+x[0]+'</text>'});
[.33,.66,1].forEach(function(f){grid+='<polygon points="'+A.map(function(x,i){var a=-Math.PI/2+i*2*Math.PI/n;return (cx+R*f*Math.cos(a)).toFixed(1)+","+(cy+R*f*Math.sin(a)).toFixed(1)}).join(" ")+'" fill="none" stroke="var(--bd)"/>'});
var w=v.slice().sort(function(a,b){return a[1]-b[1]})[0],best=0;S.habits.forEach(function(h){best=Math.max(best,streak(h))});
var bars=[6,5,4,3,2,1,0].map(function(i){var d=new Date();d.setDate(d.getDate()-i);var k=dk(d),t=S.habits.length,c=S.habits.filter(function(h){return prog(h,k)>=1}).length,p=t?c/t:0;return '<div style="flex:1;text-align:center"><div style="height:70px;display:flex;align-items:flex-end"><i style="display:block;width:100%;height:'+Math.max(p*100,4)+'%;background:var(--ac);border-radius:6px;opacity:'+(p?1:.25)+'"></i></div><small>'+d.getDate()+'</small></div>'}).join("");
return '<h1>Mizan 360</h1><p class="sub">صورة كاملة لتوازن يومك</p><div class="card" style="text-align:center"><div class="big" style="color:var(--ac)">'+sc+'<span style="font-size:18px;color:var(--mu)"> / 100</span></div><b>'+(sc>=80?"يوم متوازن جداً":sc>=50?"يوم كويس، كمّل":"ابدأ بخطوة صغيرة")+'</b><svg viewBox="0 0 260 240" style="width:100%;max-width:340px">'+grid+'<polygon points="'+pts.join(" ")+'" style="fill:var(--acs)" stroke="var(--ac)" stroke-width="2"/>'+lab+'</svg><p class="sub" style="margin:0">أضعف مجال اليوم: <b style="color:var(--tx)">'+w[0]+'</b></p></div>'+lvCard()+tasksCard()+'<button class="btn" data-a="tab" data-v="t">ابدأ جلسة تركيز</button><div class="card" style="margin-top:14px"><b>إنجازك آخر 7 أيام</b><div style="display:flex;gap:8px;margin-top:10px">'+bars+'</div></div><div class="card" style="margin-top:14px;display:flex;justify-content:space-between"><span>أطول سلسلة التزام</span><b>🔥 '+best+' يوم</b></div>'+repCard()}
var WL=null;function wl(){try{if(T.run&&navigator.wakeLock){navigator.wakeLock.request("screen").then(function(l){WL=l}).catch(function(){})}else if(WL){WL.release();WL=null}}catch(e){}}
function tasksCard(){S.tasks=S.tasks.filter(function(x){return !x.d||x.k==td()});var L=S.tasks,d=L.filter(function(x){return x.d}).length;
return '<div class="card" style="margin:14px 0"><div style="display:flex;justify-content:space-between"><b>مهام اليوم</b><small>'+d+' / '+L.length+'</small></div>'+L.map(function(x,i){return '<div class="ln" style="align-items:center"><span data-a="tk" data-i="'+i+'" style="cursor:pointer;flex:1;'+(x.d?'text-decoration:line-through;color:var(--mu)':'')+'">'+(x.d?'☑ ':'☐ ')+esc(x.t)+'</span><button class="cell" data-a="tx" data-i="'+i+'">×</button></div>'}).join("")+'<div style="display:flex;gap:8px;margin-top:10px"><input type="text" id="tn" placeholder="مهمة جديدة..." style="flex:1;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit"><button class="chip on" data-a="ta">إضافة</button></div></div>'}
function wk(o){var t=S.habits.length,r={c:0,f:0,s:0,a:{}};AR.forEach(function(a){r.a[a]=[0,0]});
for(var i=o;i<o+7;i++){var d=new Date();d.setDate(d.getDate()-i);var k=dk(d);S.habits.forEach(function(h){var p=prog(h,k);r.c+=p;var q=r.a[h.area];if(q){q[0]+=p;q[1]++}});var ss=S.sess[k]||{};for(var c in ss)r.f+=ss[c];r.s+=S.screen[k]||0}
r.p=t?Math.round(r.c/(t*7)*100):0;return r}
function repCard(){var a=wk(0),b=wk(7),df=a.p-b.p,ar=AR.map(function(x){var q=a.a[x];return [x,q[1]?q[0]/(q[1]*7):null]}).filter(function(x){return x[1]!==null}).sort(function(x,y){return x[1]-y[1]}),w=ar[0],avs=a.s/7,lim=S.limit*3600,tip;
tip=avs>lim?"متوسط استخدامك أعلى من الحد اليومي، قلل وقت الشاشة الأسبوع الجاي.":a.f<120?"حاول توصل لـ 120 دقيقة تركيز على الأقل الأسبوع الجاي.":w&&w[1]<.6?"ركز الأسبوع الجاي على مجال "+w[0]+" بعادة صغيرة كل يوم.":"أداء ممتاز، كمّل بنفس الثبات وزوّد هدف عاداتك شوية.";
return '<div class="card" style="margin-top:14px"><b>تقريرك الأسبوعي</b><div class="ln"><span>التزام العادات</span><b>'+a.p+'%'+(b.p?' <small style="display:inline;color:'+(df>=0?'#34d399':'#fb923c')+'">'+(df>=0?'▲ ':'▼ ')+Math.abs(df)+'%</small>':'')+'</b></div><div class="ln"><span>وقت التركيز</span><b>'+Math.floor(a.f/60)+' س '+a.f%60+' د</b></div><div class="ln"><span>متوسط الشاشة يومياً</span><b>'+Math.round(avs/60)+' د</b></div>'+(w?'<div class="ln"><span>أضعف مجال</span><b>'+w[0]+'</b></div>':'')+'<p class="sub" style="margin:12px 0 0">💡 '+tip+'</p></div>'+bestCard()}
function bestCard(){var H=S.hrs,tot=0,P=[["صباحاً",5,11],["ظهراً",12,16],["مساءً",17,21],["ليلاً",22,4]],pm=[0,0,0,0],bh=-1,bv=0;
for(var k in H){var h=+k;tot+=H[k];if(H[k]>bv){bv=H[k];bh=h}P.forEach(function(p,i){if(p[1]<=p[2]?h>=p[1]&&h<=p[2]:h>=p[1]||h<=p[2])pm[i]+=H[k]})}
var mx=Math.max.apply(null,pm.concat([1])),bi=pm.indexOf(Math.max.apply(null,pm)),hr=bh>=0?(bh%12||12)+(bh<12?" ص":" م"):"";
return '<div class="card" style="margin-top:14px"><b>أفضل وقت للتركيز</b>'+(tot<10?'<p class="sub" style="margin:8px 0 0">سجّل كام جلسة تركيز وهنحدد لك أفضل وقت.</p>':'<p class="sub" style="margin:6px 0 10px">بتركز أكتر '+P[bi][0]+'، وأقوى ساعة عندك حوالي <b style="color:var(--tx)">'+hr+'</b></p><div style="display:flex;gap:8px">'+P.map(function(p,i){return '<div style="flex:1;text-align:center"><div style="height:60px;display:flex;align-items:flex-end"><i style="display:block;width:100%;height:'+Math.max(pm[i]/mx*100,4)+'%;background:'+(i==bi?'var(--ac)':'var(--in)')+';border-radius:6px"></i></div><small>'+p[0]+'</small></div>'}).join('')+'</div>')+'</div>'}
function xpInfo(){var x=0,f=0;S.habits.forEach(function(h){var L=S.log[h.id]||{};for(var k in L)if(prog(h,k)>=1)x+=10});for(var d in S.sess)for(var c in S.sess[d]){x+=S.sess[d][c];f+=S.sess[d][c]}return {x:x,f:f}}
function lvCard(){var o=xpInfo(),TH=[0,100,300,600,1000,1600],NM=["مبتدئ","ملتزم","منظّم","متوازن","محترف","أسطورة"],i=0;TH.forEach(function(t,j){if(o.x>=t)i=j});
var nx=TH[i+1],p=nx?(o.x-TH[i])/(nx-TH[i]):1,best=0,dt=0,full=S.habits.length>=3&&S.habits.every(function(h){return prog(h,td())>=1});
